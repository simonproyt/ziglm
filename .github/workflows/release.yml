name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux:
    name: Build Linux Release Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.0'
          method: 'network'

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Optimized Release Binary
        run: zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v3

      - name: Upload Release Binary
        uses: softprops/action-gh-release@v2
        with:
          files: zig-out/bin/*
